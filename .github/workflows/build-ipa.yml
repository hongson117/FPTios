name: Build FPT Apple TV (tvOS) IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tvos-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Inject Build Version into Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 2.1.0" Sources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Sources/Info.plist

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build & Archive FPT Apple TV App (tvOS)
        run: |
          xcodebuild archive \
            -project FPT.xcodeproj \
            -scheme FPT \
            -destination "generic/platform=tvOS" \
            -archivePath build/FPT.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package FTVOS.ipa
        run: |
          mkdir -p build/tvOS/Payload
          cp -R build/FPT.xcarchive/Products/Applications/FPT.app build/tvOS/Payload/
          cp Sources/AppIcon*.png build/tvOS/Payload/FPT.app/ || true
          cp Sources/Icon*.png build/tvOS/Payload/FPT.app/ || true
          cd build/tvOS && zip -r -q ../FTVOS.ipa Payload && cd ../..
          ls -lh build/FTVOS.ipa

      - name: Upload FTVOS Apple TV IPA
        uses: actions/upload-artifact@v4
        with:
          name: FTVOS-AppleTV-IPA
          path: |
            build/FTVOS.ipa
          if-no-files-found: error

      - name: Create & Sync Latest GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v2.1.0-${{ github.run_number }}"
          gh release create "$TAG_NAME" build/FTVOS.ipa \
            --latest \
            --title "FTVOS Apple TV (4K UHD 50fps & Auto-Stream Sync) - v2.1.0 Build #${{ github.run_number }}" \
            --notes "Ứng dụng FTVOS độc lập dành riêng cho Apple TV (tvOS): chuẩn hóa luồng Ngoại Hạng Anh 4K UHD 2160p50 HEVC + 1080p50 FHD qua cổng /api/v7.1_ios/, giữ đa luồng âm thanh Stereo/Dolby 5.1 và tích hợp cơ chế tự động đổi luồng từ xa qua GitHub (remote_stream_config.json)."
          gh release upload v2.0.0-3 build/FTVOS.ipa --clobber || true