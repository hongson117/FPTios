name: Build FPT Apple TV (tvOS) IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tvos-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Inject Build Version into Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 2.1.0" Sources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Sources/Info.plist

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build & Archive FPT Apple TV App (tvOS)
        run: |
          xcodebuild archive \
            -project FPT.xcodeproj \
            -scheme FPT \
            -destination "generic/platform=tvOS" \
            -archivePath build/FPT.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Both Parallel IPAs (No-MCP & MCP)
        run: |
          # 1. Bản Gốc Không MCP (FTVOS_4K_Khong_MCP.ipa / FTVOS.ipa) - Bundle ID: vn.ftvos.appletv
          mkdir -p build/tvOS_NoMCP/Payload
          cp -R build/FPT.xcarchive/Products/Applications/FPT.app build/tvOS_NoMCP/Payload/
          cp Sources/AppIcon*.png build/tvOS_NoMCP/Payload/FPT.app/ || true
          cp Sources/Icon*.png build/tvOS_NoMCP/Payload/FPT.app/ || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'FTVOS 4K (Gốc)'" build/tvOS_NoMCP/Payload/FPT.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 'FTVOS 4K (Gốc)'" build/tvOS_NoMCP/Payload/FPT.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier vn.ftvos.appletv" build/tvOS_NoMCP/Payload/FPT.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :FTVOSEnableMCP false" build/tvOS_NoMCP/Payload/FPT.app/Info.plist
          codesign --force --sign - --deep build/tvOS_NoMCP/Payload/FPT.app
          cd build/tvOS_NoMCP && zip -r -q ../FTVOS_4K_Khong_MCP.ipa Payload && cd ../..
          cp build/FTVOS_4K_Khong_MCP.ipa build/FTVOS.ipa

          # 2. Bản Có Cập Nhật Luồng Qua Cloudflare MCP (FTVOS_4K_Co_MCP.ipa) - Bundle ID riêng: vn.ftvos.appletv.mcp
          mkdir -p build/tvOS_MCP/Payload
          cp -R build/FPT.xcarchive/Products/Applications/FPT.app build/tvOS_MCP/Payload/
          cp Sources/AppIcon*.png build/tvOS_MCP/Payload/FPT.app/ || true
          cp Sources/Icon*.png build/tvOS_MCP/Payload/FPT.app/ || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'FTVOS 4K (MCP)'" build/tvOS_MCP/Payload/FPT.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 'FTVOS 4K (MCP)'" build/tvOS_MCP/Payload/FPT.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier vn.ftvos.appletv.mcp" build/tvOS_MCP/Payload/FPT.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :FTVOSEnableMCP true" build/tvOS_MCP/Payload/FPT.app/Info.plist
          codesign --force --sign - --deep build/tvOS_MCP/Payload/FPT.app
          cd build/tvOS_MCP && zip -r -q ../FTVOS_4K_Co_MCP.ipa Payload && cd ../..

          ls -lh build/*.ipa

      - name: Upload FTVOS Apple TV IPAs
        uses: actions/upload-artifact@v4
        with:
          name: FTVOS-AppleTV-IPA
          path: |
            build/FTVOS_4K_Khong_MCP.ipa
            build/FTVOS_4K_Co_MCP.ipa
            build/FTVOS.ipa
          if-no-files-found: error

      - name: Create & Sync Latest GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v2.1.0-${{ github.run_number }}"
          gh release create "$TAG_NAME" build/FTVOS_4K_Khong_MCP.ipa build/FTVOS_4K_Co_MCP.ipa build/FTVOS.ipa \
            --latest \
            --title "FTVOS Apple TV (Bộ Đôi 4K UHD: Bản Gốc & Bản MCP) - v2.1.0 Build #${{ github.run_number }}" \
            --notes "Bộ đôi ứng dụng FTVOS cho Apple TV (tvOS): 1) FTVOS_4K_Khong_MCP.ipa (Tên app: FTVOS 4K (Gốc), Bundle ID: vn.ftvos.appletv) và 2) FTVOS_4K_Co_MCP.ipa (Tên app: FTVOS 4K (MCP), Bundle ID: vn.ftvos.appletv.mcp). Hỗ trợ cài đặt song song cả 2 app và hiển thị chuẩn nhãn 4K UHD 2160p50 cho Liverpool - Arsenal, Leeds - Tottenham cùng các trận Ngoại Hạng Anh 4K."
          gh release upload v2.0.0-3 build/FTVOS_4K_Khong_MCP.ipa build/FTVOS_4K_Co_MCP.ipa build/FTVOS.ipa --clobber || true
