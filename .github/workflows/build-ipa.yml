name: Build FPT Apple TV (tvOS) IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tvos-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build & Archive FPT Apple TV App (tvOS)
        run: |
          xcodebuild archive \
            -project FPT.xcodeproj \
            -scheme FPT \
            -destination "generic/platform=tvOS" \
            -archivePath build/FPT.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package FTVOS.ipa
        run: |
          mkdir -p build/tvOS/Payload
          cp -R build/FPT.xcarchive/Products/Applications/FPT.app build/tvOS/Payload/
          cp Sources/AppIcon*.png build/tvOS/Payload/FPT.app/ || true
          cp Sources/Icon*.png build/tvOS/Payload/FPT.app/ || true
          cd build/tvOS && zip -r -q ../FTVOS.ipa Payload && cd ../..
          ls -lh build/FTVOS.ipa

      - name: Upload FTVOS Apple TV IPA
        uses: actions/upload-artifact@v4
        with:
          name: FTVOS-AppleTV-IPA
          path: |
            build/FTVOS.ipa
           
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v2.0.0-${{ github.run_number }}"
          gh release create "$TAG_NAME" build/FTVOS.ipa \
            --title "FTVOS Apple TV (tvOS FairPlay 4K/FHD) - v2.0.0 Build #${{ github.run_number }}" \
            --notes "Ứng dụng FTVOS độc lập dành riêng cho Apple TV (tvOS) hỗ trợ Đăng Nhập SĐT + OTP, Đăng Xuất & Đổi Tài Khoản trực tiếp trên Apple TV, giải mã phần cứng FairPlay (SigmaDRM + CastLabs DRMtoday) và tự động cập nhật lịch Ngoại Hạng Anh."
