name: FPT
options:
  bundleIdPrefix: vn.ftvos
  deploymentTarget:
    tvOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  FPT:
    type: application
    platform: tvOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: "FPT"
        PRODUCT_BUNDLE_IDENTIFIER: "vn.ftvos.appletv"
        TARGETED_DEVICE_FAMILY: "3"
        INFOPLIST_FILE: "Sources/Info.plist"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
